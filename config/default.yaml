app:
  name: "ai-orchestrator"
  version: "1.0.0"
  environment: "development"
  logLevel: "info"

server:
  host: "127.0.0.1"
  port: 3000
  wsPort: 3001
  cors:
    origin: "*"
    credentials: true

orchestrator:
  maxConcurrentAgents: 10
  defaultTimeout: 300000
  retryAttempts: 3
  retryDelay: 5000
  heartbeatInterval: 30000
  taskQueueSize: 1000
  agentPoolSize: 5
  healthCheckInterval: 60000

agents:
  defaultTimeout: 120000
  maxRetries: 3
  healthCheckInterval: 30000
  restartOnFailure: true
  maxRestarts: 3
  types:
    - "orchestrator"
    - "worker"
    - "researcher"
    - "coder"
    - "reviewer"
    - "tester"
    - "deployer"

agents:
  orchestrator:
    maxConcurrent: 3
    priority: 10
    capabilities:
      - "task-planning"
      - "task-delegation"
      - "progress-tracking"
      - "result-aggregation"
  worker:
    maxConcurrent: 10
    priority: 5
    capabilities:
      - "code-generation"
      - "file-operations"
      - "command-execution"
  researcher:
    maxConcurrent: 5
    priority: 7
    capabilities:
      - "web-search"
      - "documentation-lookup"
      - "api-research"
      - "best-practices"
  coder:
    maxConcurrent: 5
    priority: 8
    capabilities:
      - "code-generation"
      - "refactoring"
      - "debugging"
      - "testing"
  reviewer:
    maxConcurrent: 3
    priority: 6
    capabilities:
      - "code-review"
      - "security-audit"
      - "performance-analysis"
      - "best-practices"
  tester:
    maxConcurrent: 5
    priority: 5
    capabilities:
      - "unit-testing"
      - "integration-testing"
      - "e2e-testing"
      - "test-generation"
  deployer:
    maxConcurrent: 2
    priority: 4
    capabilities:
      - "deployment"
      - "ci-cd"
      - "infrastructure"
      - "monitoring"

logging:
  level: "info"
  format: "json"
  directory: "./logs"
  maxFiles: 10
  maxSize: "10m"
  console: true
  file: true
  rotation: "daily"

database:
  type: "sqlite"
  path: "./data/orchestrator.db"
  migrations: "./migrations"

cache:
  type: "memory"
  ttl: 3600
  maxKeys: 10000

queue:
  type: "memory"
  redis:
    host: "127.0.0.1"
    port: 6379
    password: ""
    db: 0

monitoring:
  enabled: true
  metricsPort: 9090
  healthCheckPath: "/health"
  metricsPath: "/metrics"

security:
  apiKey: ""
  jwtSecret: ""
  rateLimit:
    windowMs: 900000
    maxRequests: 100

notifications:
  enabled: false
  webhook: ""
  email:
    enabled: false
    host: ""
    port: 587
    user: ""
    pass: ""
    from: ""
  slack:
    enabled: false
    webhook: ""
  discord:
    enabled: false
    webhook: ""

agentManager:
  enabled: true
  worktreePath: "./worktrees"
  maxWorktrees: 10
  autoCleanup: true
  cleanupInterval: 3600000
  defaultBranch: "main"
  remoteName: "origin"